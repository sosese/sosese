# Build et publication de l'image sur GHCR à chaque tag v*. Ne touche jamais au VPS (§7.3) :
# aucun secret de déploiement ici, la mise en production reste manuelle.
name: Image Docker

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requis pour le cache type=gha (absent du §7.3).
      - uses: docker/setup-buildx-action@v3

      - name: Build pour test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sosese:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Même contraintes qu'en production (read_only, tmpfs, sans SMTP) : l'image doit démarrer et servir le site.
      - name: Test de démarrage
        run: |
          docker run -d --name sosese-test -p 3000:3000 --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --memory 256m sosese:test
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          echo
          statut() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1"; }
          test "$(curl -fsS http://localhost:3000/api/health)" = '{"ok":true}'
          test "$(statut /)" = 200
          test "$(statut /contact)" = 200
          test "$(statut /v2/)" = 200
          test "$(statut /v2/contact)" = 200
          curl -fsSI http://localhost:3000/v2/ | grep -qi 'x-robots-tag: noindex'
          ! curl -fsS http://localhost:3000/v2/contact | grep -q '<form'
          test "$(statut /page-inexistante)" = 404
          test "$(docker inspect -f '{{.Config.User}}' sosese-test)" = node
          for i in $(seq 1 20); do
            etat="$(docker inspect -f '{{.State.Health.Status}}' sosese-test)"
            [ "$etat" = healthy ] && break
            sleep 3
          done
          echo "healthcheck : $etat"
          test "$etat" = healthy

      - name: Journaux du conteneur de test
        if: always()
        run: docker logs sosese-test || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
