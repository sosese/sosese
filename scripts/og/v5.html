<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../src/styles/tokens.css"><style>
@font-face{font-family:Inter;src:url(../../public/fonts/inter-var.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(../../public/fonts/jetbrains-mono-var.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.c{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;border-top:8px solid var(--accent)}
.logo{font-size:40px;font-weight:600;letter-spacing:-.02em}.logo span{color:var(--accent)}
.e{font-family:var(--font-mono);font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:24px}
h1{margin:0;font-size:64px;line-height:1.1;letter-spacing:-.02em;font-weight:600;max-width:1000px}
.f{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--font-mono);font-size:22px;color:var(--ink-muted)}
.mid{display:flex;gap:56px;align-items:center}
.stat{min-width:300px;display:flex;flex-direction:column;gap:10px;font-size:22px}.stat>div:not(.bar){display:flex;justify-content:space-between}
.k{color:var(--ink-muted)}.v{font-family:var(--font-mono);font-size:30px}.v.a{color:var(--accent)}
